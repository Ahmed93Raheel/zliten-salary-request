<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استلام شهادات المرتب - مراقبة التربية والتعليم زليتن</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold-primary: #c59224;
      --gold-dark: #8c620c;
      --gold-deep: #614204;
      --gold-soft: #fdf7e7;
      --gold-border: #e5c67b;
      --royal-blue: #0f3d7c;
      --royal-blue-dark: #092752;
      --royal-blue-soft: #eef4fc;
      --white: #ffffff;
      --bg-page: #faf6ec;
      --text-main: #1b2230;
      --text-muted: #5a6577;
      --border: #e3d5b2;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --shadow: 0 12px 30px rgba(97, 66, 4, 0.1);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(180deg, #f5e7c2 0%, var(--bg-page) 300px, var(--bg-page) 100%);
      color: var(--text-main);
      line-height: 1.65;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-banner {
      background: linear-gradient(135deg, var(--gold-deep) 0%, var(--gold-dark) 48%, var(--gold-primary) 100%);
      color: var(--white);
      border-bottom: 4px solid var(--royal-blue);
      padding: 18px 20px;
      box-shadow: 0 6px 20px rgba(97, 66, 4, 0.18);
    }

    .top-banner-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .state-label {
      margin: 0 0 2px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff8e3;
    }

    .institution-title {
      margin: 0;
      font-size: clamp(1.25rem, 2.4vw, 1.75rem);
      font-weight: 800;
      color: var(--white);
    }

    .system-subtitle {
      margin: 4px 0 0;
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      font-weight: 800;
      color: #fff3cf;
    }

    .header-pill {
      background: var(--white);
      color: var(--gold-deep);
      border: 2px solid var(--royal-blue);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.88rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .container {
      max-width: 1180px;
      width: calc(100% - 32px);
      margin: 20px auto 32px;
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 4px solid var(--gold-primary);
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 6px 16px rgba(97, 66, 4, 0.06);
    }

    .stat-label {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .stat-value {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--royal-blue);
      margin-top: 2px;
    }

    .card {
      background: var(--white);
      border: 1.5px solid var(--gold-border);
      border-top: 5px solid var(--gold-primary);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .filters-group {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
    }

    .filter-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 175px;
    }

    .filter-item label {
      font-size: 0.86rem;
      font-weight: 800;
      color: var(--gold-deep);
    }

    input[type="text"],
    input[type="date"],
    select {
      padding: 9px 12px;
      border: 1.5px solid var(--gold-border);
      border-radius: 9px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.92rem;
      color: var(--text-main);
      background: var(--white);
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus {
      outline: none;
      border-color: var(--royal-blue);
      box-shadow: 0 0 0 3px rgba(15, 61, 124, 0.12);
    }

    .print-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-print-today {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: var(--white);
      border: 2px solid var(--royal-blue);
      border-radius: 10px;
      padding: 10px 18px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-print-all {
      background: var(--royal-blue);
      color: var(--white);
      border: 2px solid var(--gold-primary);
      border-radius: 10px;
      padding: 10px 18px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.94rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-print-all:hover { background: var(--royal-blue-dark); }

    .btn-reset {
      background: var(--gold-soft);
      color: var(--gold-deep);
      border: 1.5px solid var(--gold-border);
      border-radius: 9px;
      padding: 9px 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-reset:hover { background: #faecc8; }

    .btn-delete-row {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #fca5a5;
      border-radius: 7px;
      padding: 4px 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
      background: var(--white);
    }

    thead th {
      background: linear-gradient(180deg, var(--gold-dark) 0%, var(--gold-deep) 100%);
      color: var(--white);
      font-weight: 800;
      font-size: 0.9rem;
      padding: 11px 10px;
      border-bottom: 3px solid var(--royal-blue);
      text-align: right;
      white-space: nowrap;
    }

    tbody td {
      padding: 10px;
      border-bottom: 1px solid #efe4c8;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) { background: #fffdf8; }
    tbody tr:hover { background: var(--gold-soft); }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.98rem;
    }

    .print-sheet { display: none; }

    .site-footer {
      background: var(--gold-deep);
      color: var(--white);
      border-top: 3px solid var(--royal-blue);
      padding: 14px 20px;
      font-size: 0.9rem;
    }

    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .designer-credit {
      color: #fff3cf;
      font-weight: 800;
    }

    .hidden-lock-trigger {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.24);
      font-family: 'Cairo', sans-serif;
      font-size: 0.72rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    .lock-banner {
      display: none;
      background: #fffbeb;
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-deep);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.88rem;
      font-weight: 700;
      align-items: center;
      justify-content: space-between;
    }

    .lock-banner.active { display: flex; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 16, 8, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.open { display: flex; }

    .modal-card {
      background: var(--white);
      border-top: 5px solid var(--gold-primary);
      border-radius: var(--radius);
      max-width: 440px;
      width: 100%;
      padding: 22px;
    }

    .btn-confirm {
      background: var(--gold-primary);
      color: var(--white);
      border: none;
      border-radius: 9px;
      padding: 9px 18px;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      cursor: pointer;
    }

    @media (max-width: 820px) {
      .stats-grid { grid-template-columns: 1fr; }
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11.5pt;
      }

      .top-banner,
      .stats-grid,
      .card,
      .site-footer,
      .lock-banner,
      .modal-backdrop,
      .no-print {
        display: none !important;
      }

      .container {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
      }

      .print-sheet {
        display: block !important;
        padding: 8px 0;
      }

      .print-header {
        text-align: center;
        border-bottom: 2px solid #000000;
        padding-bottom: 10px;
        margin-bottom: 12px;
      }

      .print-header h1 { margin: 0 0 4px; font-size: 13pt; font-weight: 800; }
      .print-header h2 { margin: 0 0 4px; font-size: 15pt; font-weight: 800; }
      .print-header h3 { margin: 0; font-size: 12pt; font-weight: 700; }

      .print-meta-bar {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        background: #f8f8f8;
        border: 1px solid #444444;
        padding: 8px 12px;
        margin-bottom: 12px;
        font-size: 10.5pt;
        font-weight: 700;
      }

      .print-table {
        width: 100%;
        min-width: 0 !important;
        border-collapse: collapse;
      }

      .print-table th,
      .print-table td {
        border: 1px solid #222222;
        padding: 7px 8px;
        text-align: right;
        font-size: 10pt;
        color: #000000;
        background: #ffffff !important;
      }
